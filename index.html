<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Varnish Demo Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-10:#E5F2FF; --blue-20:#B2D9FF; --blue-30:#66BAFF; --blue-40:#33A3FF;
    --blue-50:#008CFF; --blue-60:#0763ED; --blue-70:#0D51B8; --blue-80:#0B418C;
    --pink-50:#B84DFF; --purple-50:#594DFF; --teal-50:#00BECC; --lime-50:#B4E52E;
    --red:#DA1E28;
    --gray-05:#FAFAFA; --gray-10:#F7F7F7; --gray-20:#F0F0F0; --gray-30:#E1E2E3;
    --gray-40:#B8B8B8; --gray-50:#949AA2; --gray-60:#818181; --gray-70:#4E5157;
    --gray-80:#383B40; --gray-85:#25272A; --gray-90:#141415; --gray-100:#0A0A0A;
    --white:#FFFFFF;
    --bg: var(--gray-05); --panel-bg: var(--white); --panel-border: var(--gray-30);
    --node-bg: var(--gray-20); --node-border: var(--gray-60);
    --text-primary: var(--gray-100); --text-secondary: var(--gray-70);
    --rail-bg: var(--gray-100); --rail-text: var(--gray-10); --rail-text-dim: var(--gray-60);
    --mid-fill: #E5F2FF;
  }
  [data-theme="dark"]{
    --bg: var(--gray-100); --panel-bg: var(--gray-90); --panel-border: var(--gray-80);
    --node-bg: var(--gray-90); --node-border: var(--gray-70);
    --text-primary: var(--gray-10); --text-secondary: var(--gray-50);
    --mid-fill: #0D2363;
  }
  *{box-sizing:border-box;}
  body{ margin:0; height:100vh; overflow:hidden; font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--bg); color:var(--text-primary); display:flex; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }

  .rail{ width:250px; min-width:250px; background:var(--rail-bg); color:var(--rail-text);
    display:flex; flex-direction:column; padding:20px 0; height:100vh; overflow-y:auto; }
  .rail-brand{ padding:0 20px 18px; font-weight:700; font-size:15px; letter-spacing:.02em; }
  .rail-brand span{ color:var(--blue-40); }
  .rail-section-label{ padding:14px 20px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--rail-text-dim); font-family:'IBM Plex Mono',monospace; }
  .rail-item{ padding:9px 20px; font-size:14px; cursor:pointer; border-left:3px solid transparent;
    color:var(--rail-text-dim); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rail-item:hover{ color:var(--rail-text); background:rgba(255,255,255,0.04); }
  .rail-item.active{ color:var(--white); border-left-color:var(--blue-40); background:rgba(0,140,255,0.14); font-weight:500; }
  .rail-item .tag{ font-family:'IBM Plex Mono',monospace; font-size:9px; padding:2px 6px; border-radius:4px;
    background:var(--gray-80); color:var(--rail-text-dim); letter-spacing:.04em; }
  .rail-item.active .tag{ background:var(--blue-60); color:var(--white); }

  .main{ flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid var(--panel-border); }
  .topbar h1{ font-size:18px; font-weight:600; margin:0; }
  .topbar .subtitle{ font-size:12.5px; color:var(--text-secondary); margin-top:2px; }
  .theme-toggle{ border:1px solid var(--panel-border); background:transparent; color:var(--text-primary);
    border-radius:100px; padding:6px 14px; font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }

  .canvas-wrap{ flex:1; position:relative; padding:8px 26px; min-height:0; }
  .canvas-panel{ background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:20px; height:100%; position:relative; overflow:hidden; }
  svg{ width:100%; height:100%; display:block; }

  .impact-badge{ position:absolute; top:16px; right:16px; background:var(--gray-100); color:#fff;
    border-radius:12px; padding:9px 14px; text-align:right; }
  .impact-badge .num{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:18px; color:var(--blue-30); line-height:1; }
  .impact-badge .lab{ font-size:9.5px; color:var(--gray-50); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }

  .legend{ position:absolute; bottom:16px; left:16px; display:flex; gap:14px; flex-wrap:wrap;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px; padding:7px 13px; font-size:10.5px; color:var(--text-secondary); }
  .legend .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

  .controls{ border-top:1px solid var(--panel-border); padding:12px 26px 14px; display:flex; flex-direction:column; gap:10px; }
  .controls-row{ display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap; }
  .control-group{ display:flex; flex-direction:column; gap:5px; min-width:110px; }
  .control-group label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary); font-family:'IBM Plex Mono',monospace; }
  .stepper{ display:flex; align-items:center; gap:8px; }
  .stepper button{ width:24px; height:24px; border-radius:50%; border:1px solid var(--panel-border); background:transparent; color:var(--text-primary); font-size:14px; cursor:pointer; line-height:1; }
  .stepper button:hover{ background:var(--node-bg); }
  .stepper .val{ min-width:20px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }

  input[type=range]{ width:130px; accent-color: var(--blue-50); }
  .slider-row{ display:flex; align-items:center; gap:8px; }
  .slider-row .val{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; min-width:70px; }

  .scenario-btns{ display:flex; gap:8px; flex-wrap:wrap; }
  .scenario-btn{ padding:8px 14px; border-radius:100px; border:1px solid var(--panel-border); background:transparent; color:var(--text-primary); font-size:12px; cursor:pointer; font-weight:500; }
  .scenario-btn:hover{ background:var(--node-bg); }
  .scenario-btn.active{ background:var(--gray-100); color:var(--white); border-color:var(--gray-100); }
  [data-theme="dark"] .scenario-btn.active{ background:var(--blue-50); border-color:var(--blue-50); color:var(--white); }
  .spacer{ flex:1; }
</style>
</head>
<body data-theme="light">

<div class="rail">
  <div class="rail-brand">VARNISH <span>// DEMO CONSOLE</span></div>
  <div class="rail-section-label">Products</div>
  <div id="railProducts"></div>

  <div class="rail-section-label" id="railScenariosLabel">Use cases</div>
  <div id="railScenarios"></div>

  <div style="flex:1"></div>
  <div style="padding:14px 20px; font-size:11px; color:var(--rail-text-dim); font-family:'IBM Plex Mono',monospace;">prototype v0.4 — data-driven</div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <h1 id="topTitle">Virtual Registry</h1>
      <div class="subtitle" id="topSubtitle">Steady-state traffic</div>
    </div>
    <button class="theme-toggle" id="themeToggle">◐ dark mode</button>
  </div>

  <div class="canvas-wrap">
    <div class="canvas-panel">
      <svg id="diagram" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="impact-badge">
        <div class="num" id="impactNum">72 TB</div>
        <div class="lab" id="impactLab">offloaded / mo</div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-row">
      <div class="control-group">
        <label id="lab-left">Origins</label>
        <div class="stepper">
          <button data-adj="upstreams" data-delta="-1">−</button>
          <span class="val" id="val-upstreams">4</span>
          <button data-adj="upstreams" data-delta="1">+</button>
        </div>
      </div>
      <div class="control-group">
        <label id="lab-mid">Varnish nodes</label>
        <div class="stepper">
          <button data-adj="nodes" data-delta="-1">−</button>
          <span class="val" id="val-nodes">2</span>
          <button data-adj="nodes" data-delta="1">+</button>
        </div>
      </div>
      <div class="control-group">
        <label id="lab-right">Clients</label>
        <div class="stepper">
          <button data-adj="clients" data-delta="-1">−</button>
          <span class="val" id="val-clients">24</span>
          <button data-adj="clients" data-delta="1">+</button>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="control-group">
        <label>Use case</label>
        <div class="scenario-btns" id="scenarioBtns"></div>
      </div>
    </div>

    <div class="controls-row">
      <div class="control-group" style="min-width:220px">
        <label id="lab-volume">Monthly traffic volume</label>
        <div class="slider-row">
          <input type="range" id="sl-volume">
          <span class="val" id="val-volume"></span>
        </div>
      </div>
      <div class="control-group" style="min-width:190px">
        <label id="lab-ratio">Cache hit ratio</label>
        <div class="slider-row">
          <input type="range" id="sl-ratio">
          <span class="val" id="val-ratio"></span>
        </div>
      </div>
      <div class="spacer"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   DATA LAYER — every product and use case lives here. Nothing below this
   block needs to change to add a new use case, and adding a new product
   needs at most one new "effect" if its story genuinely needs a new shape.
   ========================================================================= */

const ORIGIN_SOURCES = ['JFrog Artifactory','Sonatype Nexus','Docker Hub','npm Registry','PyPI','Maven Central','Amazon ECR','Google Artifact Registry','Azure Container Registry','S3-backed store'];

const PRODUCTS = {

  virtual_registry: {
    label: 'Virtual Registry',
    tierLabels: { left:'Origins', mid:'Varnish', right:'Clients' },
    leftNodeNames: ORIGIN_SOURCES,
    midNodeLabel: i => 'VARNISH-'+(i+1),
    rightNodeLabel: i => 'client-'+String(i+1).padStart(2,'0'),
    metrics: {
      volume: { label:'Monthly traffic volume', unit:'TB/mo', min:1, max:1000, step:1, default:80 },
      ratio:  { label:'Cache hit ratio', unit:'%', min:0, max:100, step:5, default:90 }
    },
    model: { divertedLabel:'offloaded / mo', passthroughLabel:'reaches origin' },
    responseBlend: { colorA:'teal-50', colorB:'pink-50', weightSource:'passthrough' },
    legend: [
      { color:'blue-50', label:'Request' },
      { color:'teal-50', label:'Served from cache' },
      { color:'pink-50', label:'Origin fetch' },
      { color:'purple-50', label:'Routing' }
    ],
    scenarios: [
      { id:'baseline', label:'Steady-state', subtitle:'Steady-state traffic', effects: [] },
      { id:'coalescing', label:'Cache miss + coalescing', subtitle:'Cache miss + request coalescing', responseFixed:'pink-50', effects: [ {type:'funnel'} ] },
      { id:'multi_registry', label:'Many registries', subtitle:'One endpoint, many registries', originColorOverride:'purple-50', effects: [ {type:'fanout'} ] },
      { id:'private_caching', label:'Private caching', subtitle:'Auth-preserving private caching', effects: [ {type:'badge', text: () => '🔒 auth-checked', position:'aboveMid'} ] }
    ]
  }

};

const PRODUCTS_COMING_SOON = ['Artifact Firewall','Ora Streaming','Varnish CDN','Varnish AI Accelerator','Varnish Enterprise'];

/* =========================================================================
   ENGINE — generic. Reads PRODUCTS + current state, knows nothing about
   any specific product or use case by name.
   ========================================================================= */

const state = { product:'virtual_registry', scenario:'baseline', clients:24, nodes:2, upstreams:4, volume:80, ratio:90, theme:'light' };

function currentProduct(){ return PRODUCTS[state.product]; }
function currentScenario(){ return currentProduct().scenarios.find(s=>s.id===state.scenario); }

/* ---- color helpers ---- */
function tok(name){ return getComputedStyle(document.documentElement).getPropertyValue('--'+name).trim(); }
function hexToRgb(hex){ hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16); return [n>>16&255,n>>8&255,n&255]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function mixHex(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
function lighten(hex,amt){ return mixHex(hex,'#ffffff',amt); }
function mapRange(v,i0,i1,o0,o1){ v=Math.max(i0,Math.min(i1,v)); return o0+(v-i0)/(i1-i0)*(o1-o0); }

/* ---- svg core ---- */
const svg = document.getElementById('diagram');
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
let defs, flows=[], flowSeq=0;
function clearSvg(){ while(svg.firstChild) svg.removeChild(svg.firstChild); defs=el('defs',{}); svg.appendChild(defs); flows=[]; }

function stackNodes(cx, topY, count, w, h, gap, maxShow, labelFn, fill, stroke, textColor){
  const group=el('g',{});
  const shown=Math.min(count,maxShow);
  const totalH=shown*h+(shown-1)*gap;
  let y=topY-totalH/2;
  for(let i=0;i<shown;i++){
    group.appendChild(el('rect',{x:cx-w/2,y:y,width:w,height:h,rx:14,fill:fill,stroke:stroke,'stroke-width':1.4}));
    const t=el('text',{x:cx,y:y+h/2+4,'text-anchor':'middle','font-size':11,fill:textColor,'font-family':"'IBM Plex Mono',monospace"});
    t.textContent=labelFn(i); group.appendChild(t);
    y+=h+gap;
  }
  if(count>maxShow){
    const chip=el('text',{x:cx,y:y+10,'text-anchor':'middle','font-size':11,fill:textColor,'font-family':"'IBM Plex Mono',monospace"});
    chip.textContent='+ '+(count-maxShow)+' more'; group.appendChild(chip);
  }
  svg.appendChild(group);
}

function bezier(x1,y1,x2,y2){ const dx=(x2-x1)*0.45; return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`; }

function makeFlowLane(x1,y1,x2,y2, colorHex, volumeNorm, dirSign){
  flowSeq++;
  const id='flow'+flowSeq;
  const strokeW = mapRange(volumeNorm,0,1,2,12);
  const tileW = mapRange(volumeNorm,0,1,110,42);
  const highlight = lighten(colorHex,0.55);

  const grad = el('linearGradient',{id:'grad-'+id, x1:'0', y1:'0', x2:'1', y2:'0'});
  grad.appendChild(el('stop',{offset:'0%', 'stop-color':colorHex, 'stop-opacity':0.28}));
  grad.appendChild(el('stop',{offset:'50%', 'stop-color':highlight, 'stop-opacity':0.95}));
  grad.appendChild(el('stop',{offset:'100%', 'stop-color':colorHex, 'stop-opacity':0.28}));
  defs.appendChild(grad);

  const pattern = el('pattern',{id:'pat-'+id, patternUnits:'userSpaceOnUse', width:tileW, height:strokeW*2, patternTransform:'translate(0,0)'});
  pattern.appendChild(el('rect',{width:tileW, height:strokeW*2, fill:'url(#grad-'+id+')'}));
  defs.appendChild(pattern);

  const path = el('path',{d:bezier(x1,y1,x2,y2), fill:'none', stroke:'url(#pat-'+id+')', 'stroke-width':strokeW, 'stroke-linecap':'round'});
  svg.appendChild(path);

  const speed = mapRange(volumeNorm,0,1,14,90) * dirSign;
  flows.push({ pattern, tileW, speed, x:0 });
}

function addArrow(x,y,dir,color,size){
  size=size||6;
  const pts = dir==='left' ? `${x+size},${y-size} ${x},${y} ${x+size},${y+size}` : `${x-size},${y-size} ${x},${y} ${x-size},${y+size}`;
  svg.appendChild(el('polygon',{points:pts, fill:color}));
}
function badge(cx,cy,text,style){
  const bg = style==='danger' ? tok('red') : tok('gray-100');
  const w = 22 + text.length*6.4;
  svg.appendChild(el('rect',{x:cx-w/2,y:cy-15,width:w,height:30,rx:15, fill:bg, opacity:0.95}));
  const t=el('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':11.5, fill:'#fff','font-family':"'IBM Plex Mono',monospace"});
  t.textContent=text; svg.appendChild(t);
}
function tagText(x,y,text,color){
  const t=el('text',{x,y,'text-anchor':'middle','font-size':10.5, fill:color, 'font-family':"'IBM Plex Mono',monospace"});
  t.textContent=text; svg.appendChild(t);
}

/* ---- traffic model: shared by every product ---- */
function computeModel(){
  const product = currentProduct();
  const volume = state.volume;
  const ratio = state.ratio/100;
  const diverted = volume*ratio;
  const passthrough = volume-diverted;
  return { volume, diverted, passthrough, unit: product.metrics.volume.unit };
}

/* ---- fixed visual primitives — the only ways a use case can decorate the base flow ---- */
const PRIMITIVES = {
  funnel(ctx){
    const { colX, midY, state, model } = ctx;
    const nSample = Math.min(state.clients, 8);
    for(let i=0;i<nSample;i++){
      const yOff=(i-(nSample-1)/2)*7;
      svg.appendChild(el('path',{d:bezier(colX.right-53, midY+yOff+30, colX.mid+82, midY-46), fill:'none', stroke:tok('blue-50'), 'stroke-width':1.1, 'stroke-dasharray':'2 7', opacity:0.5}));
    }
    badge(colX.mid, midY+112, model.passthrough.toFixed(1)+' '+model.unit+' '+ctx.product.model.passthroughLabel);
  },
  fanout(ctx){
    const { colX, midY, state } = ctx;
    const shown=Math.min(state.upstreams,6);
    const totalH=shown*34+(shown-1)*10;
    let y=midY-totalH/2+17;
    for(let i=0;i<shown;i++){
      svg.appendChild(el('path',{d:bezier(colX.mid-82, midY, colX.left+77, y), fill:'none', stroke:tok('purple-50'), 'stroke-width':1.4, opacity:0.55}));
      y+=44;
    }
  },
  blockGate(ctx){
    const { colX, midY, model, product } = ctx;
    svg.appendChild(el('circle',{cx:colX.mid, cy:midY-46, r:9, fill:'none', stroke:tok('red'), 'stroke-width':2.4}));
    svg.appendChild(el('line',{x1:colX.mid-6,y1:midY-52,x2:colX.mid+6,y2:midY-40,stroke:tok('red'),'stroke-width':2.4}));
    badge(colX.mid, midY+112, model.diverted.toFixed(1)+' '+model.unit+' '+product.model.divertedLabel, 'danger');
  },
  badge(ctx, effect){
    const { colX, midY } = ctx;
    const y = effect.position==='aboveMid' ? midY-118 : midY+112;
    badge(colX.mid, y, effect.text(ctx.model));
  }
};

/* ---- render ---- */
function renderDiagram(){
  clearSvg();
  const H=620, midY=H/2;
  const product = currentProduct();
  const scenario = currentScenario();
  const nodeFill = tok('node-bg'), nodeStroke = tok('node-border');
  const textColor = tok('text-primary'), secText = tok('text-secondary');
  const midFill = tok('mid-fill'), blue60 = tok('blue-60');

  const colX = { left:130, mid:600, right:1070 };
  [product.tierLabels.left, product.tierLabels.mid, product.tierLabels.right].forEach((t,i)=>{
    tagText([colX.left,colX.mid,colX.right][i], 40, t.toUpperCase(), secText);
  });

  const leftNames=[]; for(let i=0;i<state.upstreams;i++) leftNames.push(product.leftNodeNames[i%product.leftNodeNames.length]);
  stackNodes(colX.left, midY, state.upstreams, 148, 34, 10, 6, i=>leftNames[i], nodeFill, nodeStroke, textColor);
  stackNodes(colX.mid, midY, state.nodes, 158, 42, 12, 5, product.midNodeLabel, midFill, blue60, textColor);
  stackNodes(colX.right, midY, state.clients, 100, 30, 8, 6, product.rightNodeLabel, nodeFill, nodeStroke, textColor);

  const model = computeModel();
  const maxV = product.metrics.volume.max;
  const rightVol = mapRange(state.volume,0,maxV,0,1);
  const leftVol = mapRange(model.passthrough,0,maxV,0,1);

  const blend = product.responseBlend;
  const weight = blend.weightSource==='diverted' ? model.diverted/model.volume : model.passthrough/model.volume;
  const responseColor = scenario.responseFixed ? tok(scenario.responseFixed) : mixHex(tok(blend.colorA), tok(blend.colorB), weight);
  const originColor = scenario.originColorOverride ? tok(scenario.originColorOverride) : tok(blend.colorB);
  const blue = tok('blue-50');

  const spread=46;
  const midY_reqR = midY-spread, midY_resR = midY+spread;

  // right (clients) <-> mid
  makeFlowLane(colX.right-53, midY_reqR, colX.mid+82, midY_reqR, blue, rightVol, -1);
  addArrow(colX.mid+88, midY_reqR, 'left', blue, 6);
  makeFlowLane(colX.mid+82, midY_resR, colX.right-53, midY_resR, responseColor, rightVol, 1);
  addArrow(colX.right-59, midY_resR, 'right', responseColor, 6);

  // mid <-> left (origins)
  makeFlowLane(colX.mid-82, midY_reqR, colX.left+77, midY_reqR, blue, leftVol, -1);
  addArrow(colX.left+83, midY_reqR, 'left', blue, 6);
  makeFlowLane(colX.left+77, midY_resR, colX.mid-82, midY_resR, originColor, leftVol, 1);
  addArrow(colX.mid-88, midY_resR, 'right', originColor, 6);

  // dispatch this use case's declared effects through the fixed primitive set
  const ctx = { colX, midY, state, model, product };
  (scenario.effects||[]).forEach(effect=>{
    const fn = PRIMITIVES[effect.type];
    if(fn) fn(ctx, effect);
  });
}

/* ---- animation ---- */
let lastT = performance.now();
function tick(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  flows.forEach(f=>{ f.x=(f.x+f.speed*dt)%f.tileW; f.pattern.setAttribute('patternTransform',`translate(${f.x},0)`); });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* =========================================================================
   UI — built entirely from PRODUCTS at load time and on product switch.
   ========================================================================= */

function buildProductRail(){
  const wrap = document.getElementById('railProducts');
  wrap.innerHTML = '';
  Object.keys(PRODUCTS).forEach(key=>{
    const item = document.createElement('div');
    item.className = 'rail-item'+(key===state.product?' active':'');
    item.dataset.product = key;
    item.innerHTML = `<span>${PRODUCTS[key].label}</span><span class="tag">LIVE</span>`;
    item.addEventListener('click', ()=>selectProduct(key));
    wrap.appendChild(item);
  });
  PRODUCTS_COMING_SOON.forEach(name=>{
    const item = document.createElement('div');
    item.className = 'rail-item';
    item.style.opacity = '0.6';
    item.innerHTML = `<span>${name}</span><span class="tag">soon</span>`;
    wrap.appendChild(item);
  });
}

function buildScenarioRail(){
  const wrap = document.getElementById('railScenarios');
  wrap.innerHTML = '';
  currentProduct().scenarios.forEach(sc=>{
    const item = document.createElement('div');
    item.className = 'rail-item sc-item'+(sc.id===state.scenario?' active':'');
    item.textContent = sc.label; item.dataset.sc = sc.id;
    item.addEventListener('click', ()=>selectScenario(sc.id));
    wrap.appendChild(item);
  });
  document.getElementById('railScenariosLabel').textContent = currentProduct().label+' — use cases';
}

function buildScenarioButtons(){
  const wrap = document.getElementById('scenarioBtns');
  wrap.innerHTML = '';
  currentProduct().scenarios.forEach(sc=>{
    const b = document.createElement('button');
    b.className = 'scenario-btn'+(sc.id===state.scenario?' active':'');
    b.textContent = sc.label; b.dataset.sc = sc.id;
    b.addEventListener('click', ()=>selectScenario(sc.id));
    wrap.appendChild(b);
  });
}

function buildLegend(){
  const wrap = document.getElementById('legend');
  wrap.innerHTML = currentProduct().legend.map(l=>
    `<span><i class="dot" style="background:var(--${l.color})"></i>${l.label}</span>`
  ).join('');
}

function applyMetricControls(){
  const product = currentProduct();
  const v = product.metrics.volume, r = product.metrics.ratio;
  const volInput = document.getElementById('sl-volume'), ratInput = document.getElementById('sl-ratio');
  volInput.min=v.min; volInput.max=v.max; volInput.step=v.step; volInput.value=state.volume;
  ratInput.min=r.min; ratInput.max=r.max; ratInput.step=r.step; ratInput.value=state.ratio;
  document.getElementById('lab-volume').textContent = v.label;
  document.getElementById('lab-ratio').textContent = r.label;
  document.getElementById('lab-left').textContent = product.tierLabels.left;
  document.getElementById('lab-mid').textContent = product.tierLabels.mid+' nodes';
  document.getElementById('lab-right').textContent = product.tierLabels.right;
}

function selectProduct(key){
  state.product = key;
  const product = PRODUCTS[key];
  state.scenario = product.scenarios[0].id;
  state.volume = product.metrics.volume.default;
  state.ratio = product.metrics.ratio.default;
  document.getElementById('topTitle').textContent = product.label;
  buildProductRail(); buildScenarioRail(); buildScenarioButtons(); buildLegend(); applyMetricControls();
  refresh();
}

function selectScenario(id){
  state.scenario = id;
  document.querySelectorAll('.sc-item').forEach(b=>b.classList.toggle('active', b.dataset.sc===id));
  document.querySelectorAll('.scenario-btn').forEach(b=>b.classList.toggle('active', b.dataset.sc===id));
  document.getElementById('topSubtitle').textContent = currentScenario().subtitle;
  refresh();
}

document.querySelectorAll('[data-adj]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const key=btn.getAttribute('data-adj');
    const delta=parseInt(btn.getAttribute('data-delta'),10);
    const min={clients:1,nodes:1,upstreams:1}[key];
    const max={clients:60,nodes:8,upstreams:8}[key];
    state[key]=Math.max(min,Math.min(max,state[key]+delta));
    refresh();
  });
});
document.getElementById('sl-volume').addEventListener('input', e=>{ state.volume=parseFloat(e.target.value); refresh(); });
document.getElementById('sl-ratio').addEventListener('input', e=>{ state.ratio=parseFloat(e.target.value); refresh(); });
document.getElementById('themeToggle').addEventListener('click', ()=>{
  state.theme = state.theme==='light'?'dark':'light';
  document.body.setAttribute('data-theme', state.theme);
  document.getElementById('themeToggle').textContent = state.theme==='light' ? '◐ dark mode':'◑ light mode';
  refresh();
});

function refresh(){
  const product = currentProduct();
  document.getElementById('val-clients').textContent = state.clients;
  document.getElementById('val-nodes').textContent = state.nodes;
  document.getElementById('val-upstreams').textContent = state.upstreams;
  document.getElementById('val-volume').textContent = state.volume+' '+product.metrics.volume.unit;
  document.getElementById('val-ratio').textContent = state.ratio+product.metrics.ratio.unit;

  const model = computeModel();
  document.getElementById('impactNum').textContent = model.diverted.toFixed(1)+' '+model.unit;
  document.getElementById('impactLab').textContent = product.model.divertedLabel;

  renderDiagram();
}

/* ---- boot ---- */
buildProductRail();
buildScenarioRail();
buildScenarioButtons();
buildLegend();
applyMetricControls();
document.getElementById('topTitle').textContent = currentProduct().label;
document.getElementById('topSubtitle').textContent = currentScenario().subtitle;
refresh();
</script>
</body>
</html>
